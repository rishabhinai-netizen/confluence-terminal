name: Manual deploy (static uploaded file)
on:
  push:
    branches: [main]
    paths: ['manual_uploads/**', '.github/workflows/manual-deploy.yml']
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: ${{ steps.deploy.outputs.page_url }}}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p public
          cp "manual_uploads/confluence_terminal_latest.html" public/index.html
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
      - id: deploy
        uses: actions/deploy-pages@v4
