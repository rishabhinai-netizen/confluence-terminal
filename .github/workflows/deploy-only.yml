name: Deploy only (fast)
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Build HTML from seeded data
        run: |
          mkdir -p public
          python build_terminal.py --data-dir data --out public/index.html --snapshot-dir snapshots
          touch public/.nojekyll
          ls -la public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      - run: echo "Deployed to ${{ steps.deploy.outputs.page_url }}"
